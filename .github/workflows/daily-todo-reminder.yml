name: 毎日のTODOリマインダー

on:
  # 毎日 00:00 UTC (JST 9:00) に実行
  schedule:
    - cron: '0 0 * * *'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  send-todo:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: TODOリストをSlackに送信
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/send-todo-to-slack.js
