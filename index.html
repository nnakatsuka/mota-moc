function Dropdown({label,options,value,onChange,placeholder,style:st}) {
  const [open,setOpen]=useState(false);
  const ref=React.useRef();
  React.useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  return (
    <div ref={ref} style={{position:"relative",...st}}>
      <div onClick={()=>setOpen(!open)} style={{
        padding:"6px 28px 6px 8px",fontSize:12,border:"1px solid #d5d2ca",borderRadius:4,background:"#fff",cursor:"pointer",
        whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:value?s.dark:s.muted,position:"relative"
      }}>
        {value||placeholder||"-"}
        <span style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",fontSize:10,color:s.muted}}>▼</span>
      </div>
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:100,background:"#fff",border:"1px solid #d5d2ca",borderRadius:4,maxHeight:200,overflowY:"auto",boxShadow:"0 4px 12px rgba(0,0,0,0.1)"}}>
          <div onClick={()=>{onChange("");setOpen(false)}} style={{padding:"6px 10px",fontSize:12,cursor:"pointer",background:!value?"#e6f0fa":"",color:!value?s.link:s.dark}}
            onMouseEnter={e=>e.currentTarget.style.background="#f5f3ee"} onMouseLeave={e=>e.currentTarget.style.background=!value?"#e6f0fa":""}>-</div>
          {options.map(o=>(
            <div key={o} onClick={()=>{onChange(o);setOpen(false)}} style={{padding:"6px 10px",fontSize:12,cursor:"pointer",borderTop:"1px solid #f0ede6"}}
              onMouseEnter={e=>e.currentTarget.style.background="#f5f3ee"} onMouseLeave={e=>e.currentTarget.style.background=value===o?"#e6f0fa":""}>{o}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function MultiDropdown({label,options,values,onChange,placeholder,style:st}) {
  const [open,setOpen]=useState(false);
  const ref=React.useRef();
  React.useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  const toggle=(o)=>{
    if(values.includes(o)) onChange(values.filter(v=>v!==o));
    else onChange([...values,o]);
  };
  return (
    <div ref={ref} style={{position:"relative",...st}}>
      <div onClick={()=>setOpen(!open)} style={{
        padding:"6px 28px 6px 8px",fontSize:12,border:"1px solid #d5d2ca",borderRadius:4,background:"#fff",cursor:"pointer",
        whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:values.length?s.dark:s.muted,position:"relative",minHeight:30
      }}>
        {values.length?values.join(", "):(placeholder||"- 入力または選択（複数選択可能）")}
        {values.length>0&&<span onClick={e=>{e.stopPropagation();onChange([])}} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",fontSize:14,color:s.muted,cursor:"pointer"}}>×</span>}
      </div>
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:100,background:"#fff",border:"1px solid #d5d2ca",borderRadius:4,maxHeight:200,overflowY:"auto",boxShadow:"0 4px 12px rgba(0,0,0,0.1)"}}>
          {options.map(o=>(
            <div key={o} onClick={()=>toggle(o)} style={{padding:"6px 10px",fontSize:12,cursor:"pointer",borderTop:"1px solid #f0ede6",background:values.includes(o)?"#e6f0fa":"",display:"flex",alignItems:"center",gap:6}}
              onMouseEnter={e=>{if(!values.includes(o))e.currentTarget.style.background="#f5f3ee"}} onMouseLeave={e=>{if(!values.includes(o))e.currentTarget.style.background=""}}>
              <span style={{width:14,height:14,border:"1px solid #d5d2ca",borderRadius:3,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,background:values.includes(o)?s.link:"#fff",color:"#fff"}}>{values.includes(o)?"✓":""}</span>
              {o}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MemoCell({carId, onClick}) {
  const [memo, setMemo] = useState("");
  const [saved, setSaved] = useState(false);
  const save = (e) => { e.stopPropagation(); setSaved(true); setTimeout(()=>setSaved(false), 1500); };
  return (
    <div style={{display:"flex",alignItems:"center",gap:4,minWidth:160}} onClick={e=>e.stopPropagation()}>
      <input
        value={memo}
        onChange={e=>{setMemo(e.target.value);setSaved(false);}}
        placeholder="メモを入力"
        style={{flex:1,fontSize:11,padding:"3px 6px",border:"1px solid #e0ddd6",borderRadius:4,background:"#faf9f6",height:26,minWidth:0}}
      />
      <button onClick={save} style={{
        fontSize:10,padding:"3px 7px",border:"1px solid #d5d2ca",borderRadius:4,cursor:"pointer",
        background:saved?"#e8f5e9":"#fff",color:saved?"#2e7d32":"#888",whiteSpace:"nowrap",height:26,flexShrink:0
      }}>{saved?"✓":"更新"}</button>
      <button onClick={e=>{e.stopPropagation();onClick(carId,memo,setMemo,setSaved);}} title="ポップアップで入力" style={{
        width:26,height:26,border:"1px solid #d5d2ca",borderRadius:4,cursor:"pointer",
        background:"#fff",color:"#888",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,padding:0
      }}>✎</button>
    </div>
  );
}

function MemoPopup({carId, memo, setMemo, setSaved, onClose}) {
  const [local, setLocal] = useState(memo);
  const save = () => { setMemo(local); setSaved(true); setTimeout(()=>setSaved(false),1500); onClose(); };
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:10,padding:20,width:380,boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600}}>メモ編集 — {carId}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#888",lineHeight:1}}>×</button>
        </div>
        <textarea
          value={local}
          onChange={e=>setLocal(e.target.value)}
          autoFocus
          maxLength={300}
          placeholder="300文字以内でご入力ください（ユーザーには表示されません）"
          style={{width:"100%",fontSize:12,padding:"8px 10px",border:"1px solid #d5d2ca",borderRadius:6,minHeight:100,resize:"vertical",fontFamily:"inherit",lineHeight:1.7}}
        />
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
          <span style={{fontSize:11,color:"#aaa"}}>{local.length}/300文字</span>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} style={{padding:"7px 18px",fontSize:12,border:"1px solid #d5d2ca",borderRadius:6,background:"#fff",cursor:"pointer"}}>キャンセル</button>
            <button onClick={save} style={{padding:"7px 18px",fontSize:12,fontWeight:600,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:6,cursor:"pointer"}}>保存</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SpCarList({onSelect}) {
  const [page, setPage] = useState(1);
  const [perPage, setPerPage] = useState(50);
  const [popup, setPopup] = useState(null);
  const totalPages = Math.ceil(CARS.length / perPage);
  const pagedCars = CARS.slice((page-1)*perPage, page*perPage);
  const openPopup = (carId, memo, setMemo, setSaved) => setPopup({carId, memo, setMemo, setSaved});

  return (
    <div>
      {popup && (
        <MemoPopup
          carId={popup.carId}
          memo={popup.memo}
          setMemo={popup.setMemo}
          setSaved={popup.setSaved}
          onClose={()=>setPopup(null)}
        />
      )}

      {/* ヘッダー */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:"#fff",borderBottom:`1px solid #e5e2da`,fontSize:12,color:"#888"}}>
        <span>全 <strong style={{color:"#1a1a1a"}}>{CARS.length}</strong> 件</span>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <span style={{fontSize:11}}>表示：</span>
          {[50,100,150].map(n=>(
            <button key={n} onClick={()=>{setPerPage(n);setPage(1);}} style={{
              fontSize:11,padding:"2px 7px",border:`1px solid ${perPage===n?"#1a1a1a":"#d5d2ca"}`,borderRadius:4,
              background:perPage===n?"#1a1a1a":"#fff",color:perPage===n?"#fff":"#888",cursor:"pointer"
            }}>{n}</button>
          ))}
        </div>
      </div>

      {/* カードリスト */}
      {pagedCars.map(car=>(
        <div key={car.id} style={{background:"#fff",borderBottom:`1px solid #f0ede6`,padding:"10px 12px"}}>
          {/* 1行目：入札バッジ + 車両名 + 締切 */}
          <div onClick={()=>onSelect(car)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5,gap:6,cursor:"pointer"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,flex:1,minWidth:0}}>
              <span style={{fontSize:10,padding:"2px 6px",background:"#c0392b",color:"#fff",borderRadius:3,fontWeight:600,flexShrink:0}}>未入札</span>
              {car.support&&<span style={{fontSize:9,padding:"1px 5px",background:"#FFF9C4",color:"#7A6000",border:"1px solid #F9A825",borderRadius:10,fontWeight:700,flexShrink:0}}>サポート</span>}
              <span style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{car.name}</span>
            </div>
            {car.status
              ? <span style={{fontSize:10,padding:"2px 6px",background:"#e8f5e9",color:"#2e7d32",borderRadius:4,flexShrink:0}}>{car.status}</span>
              : car.deadline&&(
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:9,color:car.deadline.startsWith("今日")?"#c0392b":"#888",fontWeight:600}}>{car.deadline.startsWith("今日")?"本日":"明日"}</div>
                  <div style={{fontSize:11,color:car.deadline.startsWith("今日")?"#c0392b":"#555",fontWeight:700}}>{car.deadline.replace("今日","").replace("明日","")}</div>
                </div>
              )
            }
          </div>
          {/* 2行目：詳細情報 */}
          <div onClick={()=>onSelect(car)} style={{display:"flex",flexWrap:"wrap",gap:"3px 12px",fontSize:11,color:"#666",marginBottom:7,cursor:"pointer"}}>
            <span style={{color:"#2980b9",fontWeight:500}}>{car.id}</span>
            <span>{car.area}</span>
            <span style={{fontWeight:600,color:"#1a1a1a"}}>{car.priceMin}万〜{car.priceMax}万</span>
            <span style={{color:"#888"}}>{car.sellTiming}</span>
            <span style={{color:"#888"}}>{car.km}</span>
            {car.repair&&<span style={{color:"#c0392b",fontWeight:600}}>修復あり</span>}
          </div>
          {/* 3行目：メモ（PCと同じMemoCell） */}
          <div onClick={e=>e.stopPropagation()}>
            <MemoCell carId={car.id} onClick={openPopup}/>
          </div>
        </div>
      ))}

      {/* ページネーション */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",background:"#fff",borderTop:`1px solid #e5e2da`}}>
        <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{padding:"6px 14px",fontSize:12,border:"1px solid #d5d2ca",borderRadius:4,background:"#fff",color:page===1?"#ccc":"#333",cursor:page===1?"default":"pointer"}}>◀</button>
        {Array.from({length:totalPages},(_,i)=>i+1).map(p=>(
          <button key={p} onClick={()=>setPage(p)} style={{width:30,height:30,fontSize:12,border:`1px solid ${page===p?"#1a1a1a":"#d5d2ca"}`,borderRadius:4,background:page===p?"#1a1a1a":"#fff",color:page===p?"#fff":"#333",cursor:"pointer"}}>{p}</button>
        ))}
        <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} style={{padding:"6px 14px",fontSize:12,border:"1px solid #d5d2ca",borderRadius:4,background:"#fff",color:page===totalPages?"#ccc":"#333",cursor:page===totalPages?"default":"pointer"}}>▶</button>
      </div>
    </div>
  );
}

function CarTable({pattern, onSelect}) {
  const [hovered, setHovered] = useState(null);
  const [popup, setPopup] = useState(null);
  const [page, setPage] = useState(1);
  const [perPage, setPerPage] = useState(50);

  const cols=["査定番号","車両名","年式","走行距離","エリア","査定額（下限〜上限）","売却希望","修復","写真","情報変更","締切","サポート","メモ"];

  const openPopup = (carId, memo, setMemo, setSaved) => {
    setPopup({carId, memo, setMemo, setSaved});
  };

  const totalPages = Math.ceil(CARS.length / perPage);
  const pagedCars = CARS.slice((page-1)*perPage, page*perPage);

  const DeadlineBadge = ({deadline, status}) => {
    if(status) return <span style={{fontSize:10,padding:"2px 8px",background:s.successBg,color:s.successText,borderRadius:4,whiteSpace:"nowrap"}}>{status}</span>;
    if(!deadline) return null;
    const isToday = deadline.startsWith("今日");
    return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>
        <span style={{fontSize:9,color:isToday?"#c0392b":"#888",fontWeight:600,whiteSpace:"nowrap"}}>{isToday?"本日":"明日"}</span>
        <span style={{fontSize:11,color:isToday?s.accent:"#555",fontWeight:isToday?700:500,whiteSpace:"nowrap"}}>{deadline.replace("今日","").replace("明日","")}</span>
      </div>
    );
  };

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0,overflow:"hidden"}}>
      {popup && (
        <MemoPopup
          carId={popup.carId}
          memo={popup.memo}
          setMemo={popup.setMemo}
          setSaved={popup.setSaved}
          onClose={()=>setPopup(null)}
        />
      )}
      {/* テーブルヘッダー行 */}
      <div style={{
        display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"8px 14px",fontSize:13,color:s.muted,
        position:"sticky",top:0,background:"#fff",zIndex:2,
        borderBottom:`1px solid ${s.borderLight}`,flexShrink:0
      }}>
        <span>全 <strong style={{color:s.dark}}>{CARS.length}</strong> 件　<span style={{fontSize:11}}>{(page-1)*perPage+1}〜{Math.min(page*perPage,CARS.length)}件表示</span></span>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <select style={{fontSize:12,padding:"4px 8px",border:`1px solid #d5d2ca`,borderRadius:4,background:"#fff"}} onChange={e=>setPage(1)}>
            <option>新着順</option><option>都道府県</option><option>メーカー・車種</option><option>締切順</option><option>金額順</option>
          </select>
          <span style={{fontSize:11,color:"#aaa"}}>表示件数：</span>
          {[50,100,150].map(n=>(
            <button key={n} onClick={()=>{setPerPage(n);setPage(1);}} style={{
              fontSize:11,padding:"3px 8px",border:`1px solid ${perPage===n?"#1a1a1a":"#d5d2ca"}`,borderRadius:4,
              background:perPage===n?"#1a1a1a":"#fff",color:perPage===n?"#fff":s.muted,cursor:"pointer"
            }}>{n}件</button>
          ))}
        </div>
      </div>

      {/* テーブル本体 */}
      <div style={{flex:1,overflowX:"auto",overflowY:"auto",minHeight:0}}>
        <table style={{width:"100%",fontSize:12,borderCollapse:"collapse"}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${s.border}`,position:"sticky",top:0,background:"#fff",zIndex:1}}>
              {cols.map(c=>(
                <th key={c} style={{padding:"8px 10px",textAlign:c==="査定額（下限〜上限）"||c==="締切"?"right":"left",fontWeight:500,color:s.muted,fontSize:11,whiteSpace:"nowrap"}}

                  {c}

                <td style={{padding:"11px 10px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:10,padding:"2px 8px",background:s.accent,color:"#fff",borderRadius:3,fontWeight:600,whiteSpace:"nowrap"}}>未入札</span>

}

function VehicleSpecTable({items, cols}) {
  var numCols = cols || 3;
  var colStr = numCols === 2 ? "repeat(2,1fr)" : "repeat(3,1fr)";
  return (
    <div style={{border:"1px solid #e5e2da",borderRadius:8,overflow:"hidden",marginBottom:12,display:"grid",gridTemplateColumns:colStr,background:"#faf9f6"}}>
      {items.map(function(item, i) {
        var isWide = item[0]==="車種" || item[0]==="グレード補定情報" || item[0]==="注意事項";
        return (
          <div key={i} style={{gridColumn:isWide?"1 / -1":"span 1",borderBottom:"1px solid #f0ede6",padding:"8px 10px",background:"#fff"}}>
            <div style={{fontSize:10,color:"#888",marginBottom:2}}>{item[0]}</div>
            <div style={{fontSize:12,fontWeight:500,color:"#1a1a1a",wordBreak:"break-all",lineHeight:1.5}}>{item[1]||"－"}</div>
          </div>
        );
      })}
    </div>
  );
}

function SpecTable({specs}) {
  return (
    <div style={{border:`1px solid #e5e2da`,borderRadius:8,overflow:"hidden",marginBottom:12,background:"#fff"}}>
      <table style={{width:"100%",fontSize:11,borderCollapse:"collapse",tableLayout:"fixed"}}>
        <colgroup>
          <col style={{width:"13%"}}/><col style={{width:"20%"}}/>
          <col style={{width:"13%"}}/><col style={{width:"20%"}}/>
          <col style={{width:"14%"}}/><col style={{width:"20%"}}/>
        </colgroup>
        <tbody>
          {specs.map((row,ri)=>{
            const cells=[];
            for(let ci=0;ci<6;ci+=2){
              const label=row[ci],val=row[ci+1];
              if(!label&&!val){const prev=cells[cells.length-1];if(prev)prev.span+=2;continue;}
              cells.push({label,val,span:1,ci});
            }
            return (
              <tr key={ri} style={{borderBottom:ri<specs.length-1?`1px solid #f0ede6`:"none"}}>
                {cells.map(c=>{
                  const isRepair=c.val==="修復済"||c.val==="走行不可";
                  return [
                    <td key={c.ci} style={{padding:"6px 8px",color:"#666",background:"#efede6",whiteSpace:"nowrap",fontSize:11}}>{c.label}</td>,
                    <td key={c.ci+1} colSpan={c.span} style={{padding:"6px 8px",color:isRepair?"#c0392b":"#1a1a1a",fontWeight:isRepair?700:500,whiteSpace:"nowrap"}}>{c.val}</td>
                  ];
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

          </div>
        </div>
      )}
    </>
  );
}

                    {[
                      ["〜49万9,000円","20万円幅"],
                      ["50万〜99万9,000円","30万円幅"],
                      ["100万〜199万9,000円","40万円幅"],
                      ["200万〜299万9,000円","50万円幅"],
                      ["300万〜499万9,000円","100万円幅"],
                      ["500万円〜","150万円幅"],
                    ].map((r,i)=>(
                      <tr key={i} style={{borderBottom:i<5?`1px solid ${s.borderLight}`:"none"}}>
                        <td style={{padding:"6px 0",color:s.dark}}>{r[0]}</td>
                        <td style={{padding:"6px 0",textAlign:"right",color:s.muted}}>{r[1]}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {isSupport&&(
              <div style={{border:`1px solid #ffe0b2`,borderRadius:10,padding:16,background:"#fffde7"}}>
                <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:"#7A6000"}}>入札のご注意（サポート）</div>
                <div style={{fontSize:11,color:"#7A6000",lineHeight:1.7,marginBottom:12}}>入札額の上限を基準に、以下の通り入札できる金額に手数料がかかります。</div>
                <table style={{width:"100%",fontSize:11,borderCollapse:"collapse"}}>
                  <tbody>
                    {[
                      ["〜500,000円","40,000円"],
                      ["500,001〜1,000,000円","50,000円"],
                      ["1,000,001〜1,500,000円","60,000円"],
                      ["1,500,001〜2,000,000円","70,000円"],
                      ["2,000,001〜2,500,000円","75,000円"],
                      ["2,500,001〜3,000,000円","80,000円"],
                      ["3,000,001円〜","85,000円"],
                    ].map((r,i)=>(
                      <tr key={i} style={{borderBottom:i<6?`1px solid #ffe0b2`:"none"}}>
                        <td style={{padding:"6px 0",color:"#5D4037"}}>{r[0]}</td>
                        <td style={{padding:"6px 0",textAlign:"right",color:"#7A6000",fontWeight:600}}>{r[1]}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page,setPage]=useState("list");
  const [pattern,setPattern]=useState("A");
  const [selectedCar,setSelectedCar]=useState(null);

  const goDetail=(car)=>{setSelectedCar(car);setPage("detail");window.scrollTo(0,0);};

  if(page==="detail"&&selectedCar) {
    return <DetailPage car={selectedCar} onBack={()=>setPage("list")} onNavigate={(car)=>{setSelectedCar(car);window.scrollTo(0,0);}}/>;
  }
  return <ListPage pattern={pattern} setPattern={setPattern} onSelect={goDetail}/>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
